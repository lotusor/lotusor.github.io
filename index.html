<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
  <title>lotusor · 雨霁的blog</title>
  <meta name="description" content="lotusor 的个人技术博客 — 隙里碎笔，用代码记录思考。" />
  <link rel="icon" type="image/jpeg" href="assets/avatar.jpg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="landing.css" />
</head>
<body>
  <!-- 入场 loading 动画 -->
  <div id="loader" class="loader" aria-hidden="true">
    <div class="loader-inner">
      <div class="loader-mark">&lt;/&gt;</div>
      <div class="loader-bar"><span></span></div>
    </div>
  </div>

  <!-- Header：封面页透明贴左，文章区暗色毛玻璃 -->
  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a class="brand" href="#/" data-link>
        <span class="brand-mark"><img src="assets/avatar.jpg" alt="" /></span>
        <span class="brand-name">lotusor</span>
      </a>
    </div>
  </header>

  <main id="app"><!-- 内容由 app.js 动态渲染 --></main>

  <footer class="site-footer">
    <p>© <span id="year"></span> 雨霁的blog · 隙里碎笔</p>
    <p class="footer-sub">基于纯静态 HTML / CSS / JS 构建，Markdown 由 marked.js 渲染。</p>
  </footer>

  <!-- 音乐播放器（页面级定位：position 可改为 bottom-left / bottom-right / top-left / top-right） -->
  <nmp-player
    song-id="2127009514"
    api-base-url="https://api.hypcvgm.top/NeteaseMiniPlayer/nmp.php"
    theme="dark"
    layout="dock"
    position="bottom-right"
    lyric="true"
    default-minimized="false"
    storage-key="lotusor-blog"></nmp-player>

  <!-- 内联搜索栏（固定在左下角，与播放器相互独立） -->
  <div class="music-dock" id="musicSearch">
    <div class="ms-inline" id="msInline">
      <div class="ms-inline-input-wrap">
        <svg class="ms-search-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/></svg>
        <input class="ms-input" id="msInput" type="search" placeholder="搜歌曲" autocomplete="off" aria-label="搜索歌曲" />
        <button class="ms-close" id="msClose" type="button" aria-label="关闭搜索" hidden>✕</button>
      </div>
      <ul class="ms-results" id="msResults" hidden></ul>
      <div class="ms-status" id="msStatus"></div>
    </div>
  </div>

  <!-- 历史点播记录（本地保存，最多 20 首；点击切歌自动播放） -->
  <div class="history-dock" id="historyDock">
    <div class="history-panel" id="historyPanel" hidden>
      <div class="history-head">
        <span>历史点播记录</span>
        <button class="history-clear" id="historyClear" type="button">清空</button>
      </div>
      <ul class="history-list" id="historyList" aria-label="历史点播记录列表"></ul>
      <p class="history-empty" id="historyEmpty" hidden>还没有点播记录，搜一首歌试试～</p>
    </div>
    <button class="history-toggle" id="historyToggle" type="button" aria-expanded="false" aria-controls="historyPanel">
      <svg class="hi-clock" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm.5-13H11v6l5 3 .75-1.23-4.25-2.52V7Z"/></svg>
      历史 <span class="history-count" id="historyCount">0</span>
    </button>
  </div>

  <!-- Markdown 解析与代码高亮（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/netease-mini-player-v3@3.0.1/dist/nmpv3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
