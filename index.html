<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lotusor · 雨霁的blog</title>
  <meta name="description" content="lotusor 的个人技术博客 — 隙里碎笔，用代码记录思考。" />
  <link rel="icon" type="image/jpeg" href="assets/avatar.jpg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="landing.css" />
</head>
<body>
  <!-- 入场 loading 动画 -->
  <div id="loader" class="loader" aria-hidden="true">
    <div class="loader-inner">
      <div class="loader-mark">&lt;/&gt;</div>
      <div class="loader-bar"><span></span></div>
    </div>
  </div>

  <!-- Header：封面页透明贴左，文章区暗色毛玻璃 -->
  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a class="brand" href="#/" data-link>
        <span class="brand-mark"><img src="assets/avatar.jpg" alt="" /></span>
        <span class="brand-name">lotusor</span>
      </a>
    </div>
  </header>

  <main id="app"><!-- 内容由 app.js 动态渲染 --></main>

  <footer class="site-footer">
    <p>© <span id="year"></span> 雨霁的blog · 隙里碎笔</p>
    <p class="footer-sub">基于纯静态 HTML / CSS / JS 构建，Markdown 由 marked.js 渲染。</p>
  </footer>

  <!-- 左下角网易云音乐播放器（NeteaseMiniPlayer v3 · 公用 API · 单曲《春夜坠落》Bo Peep） -->
  <nmp-player
    song-id="2127009514"
    theme="dark"
    layout="dock"
    position="bottom-left"
    lyric="true"
    default-minimized="false"
    storage-key="lotusor-blog"></nmp-player>

  <!-- 音乐搜索：调用网易云公共 API，点结果写入 NMP 播放器 song-id 实现在线播放 -->
  <div class="music-search" id="musicSearch">
    <div class="ms-panel glass" id="msPanel" hidden>
      <div class="ms-input-row">
        <svg class="ms-search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/></svg>
        <input class="ms-input" id="msInput" type="search" placeholder="搜索歌曲 / 歌手…" autocomplete="off" aria-label="搜索歌曲" />
        <button class="ms-close" id="msClose" type="button" aria-label="关闭搜索">✕</button>
      </div>
      <ul class="ms-results" id="msResults"></ul>
      <div class="ms-status" id="msStatus"></div>
    </div>
    <button class="ms-toggle glass" id="msToggle" type="button" aria-label="搜索歌曲" title="搜索歌曲">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/></svg>
    </button>
  </div>

  <!-- Markdown 解析与代码高亮（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/netease-mini-player-v3@3.0.1/dist/nmpv3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
