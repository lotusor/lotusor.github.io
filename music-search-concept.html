<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>音乐搜索 · 抽屉式重设计概念稿 v2</title>
<style>
  :root {
    /* 复用博客暗色主题变量 */
    --bg: #080c18;
    --surface: rgba(12, 18, 32, .92);
    --glass: rgba(10, 16, 30, .82);
    --border: rgba(70, 110, 190, .22);
    --border-strong: rgba(120, 150, 220, .45);
    --text: #b8c4d8;
    --text-bright: #dde8ff;
    --text-dim: #5a6a88;
    --accent: rgba(90, 130, 255, .14);

    /* 组件尺寸 token */
    --player-w: 340px;
    --player-h: 76px;
    --peek: 44px;                    /* 收起时露出的薄边宽度（提示可拉开） */
    --open-extra: 170px;             /* 展开时薄壳额外向右伸出 ≈ +50%（输入更从容） */
    --radius: 18px;
    --dock-gap: 22px;
    --ease-drawer: cubic-bezier(.22, 1, .36, 1);
    --t-drawer: 420ms;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Inter", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background-color: var(--bg);
    background-image:
      radial-gradient(closest-side, rgba(60,100,255,.35), rgba(60,100,255,0) 70%),
      radial-gradient(closest-side, rgba(0,200,180,.28), rgba(0,200,180,0) 70%),
      radial-gradient(closest-side, rgba(140,80,255,.25), rgba(140,80,255,0) 70%);
    background-size: 130vw 130vh, 120vw 120vh, 100vw 150vh;
    background-position: -80vw -80vh, 30vw -20vh, -20vw 20vh;
    background-repeat: no-repeat;
    animation: bgFloat 18s ease-in-out infinite;
    overflow: hidden;
  }
  @keyframes bgFloat {
    0%,100% { background-position: -80vw -80vh, 30vw -20vh, -20vw 20vh; }
    50%     { background-position: 10vw -60vh, 20vw 10vh, 10vw 30vh; }
  }

  .legend {
    position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
    text-align: center; color: var(--text-dim); font-size: 13px; line-height: 1.7;
    letter-spacing: .3px; pointer-events: none; user-select: none;
  }
  .legend b { color: var(--text-bright); font-weight: 600; }

  /* ================= 音乐控件容器 ================= */
  .music-dock {
    position: fixed;
    left: var(--dock-gap);
    bottom: var(--dock-gap);
    width: calc(var(--player-w) + var(--peek));   /* 含露出薄边 */
    height: var(--player-h);
    z-index: 45;
    /* 允许薄壳展开时向右溢出容器 */
  }

  /* ---- 搜索薄壳（抽屉本体，位于播放器下层） ---- */
  .ms-shell {
    position: absolute;
    left: 0; top: 0;
    height: 100%;
    width: calc(var(--player-w) + var(--peek));   /* 收起：露出一条薄边 */
    z-index: 1;
    border-radius: var(--radius);
    background: var(--glass);
    border: 1px solid var(--border);
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    overflow: visible;                 /* 不裁切向上展开的结果浮层 */
    backdrop-filter: blur(14px);
    transition: width var(--t-drawer) var(--ease-drawer),
                box-shadow var(--t-drawer) var(--ease-drawer);
  }
  .music-dock.open .ms-shell {
    width: calc(var(--player-w) + var(--open-extra)); /* 抽出：向右多出 ~50% */
    box-shadow: 0 10px 50px rgba(0,0,0,.6),
                6px 0 24px -6px rgba(90,130,255,.35);    /* 右侧抽出的高光阴影 */
  }

  /* 薄壳内：搜索面板（右对齐，随薄壳右缘一起被「拉」出来） */
  .ms-panel {
    position: absolute;
    left: calc(100% - var(--open-extra));    /* 紧贴演奏器右侧、薄壳右段起点 */
    top: 0; bottom: 0;
    width: calc(var(--open-extra) - 46px);   /* 给右侧拉手留 46px 间隙 */
    display: flex; flex-direction: column; justify-content: center;
    gap: 8px;
    padding: 0 12px;
    border-left: 1px solid var(--border);
    opacity: 0;                       /* 收起时隐藏，展开时淡入 */
    pointer-events: none;
    transition: opacity .25s ease .08s;
  }
  .music-dock.open .ms-panel { opacity: 1; pointer-events: auto; }

  .ms-field {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.06);
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 6px 8px;
    transition: border-color .2s ease, background .2s ease;
  }
  .ms-field:focus-within {
    border-color: var(--border-strong);
    background: rgba(255,255,255,.09);
  }
  .ms-field svg { color: var(--text-dim); flex-shrink: 0; }
  .ms-input {
    flex: 1; min-width: 0;
    background: transparent; border: none; outline: none;
    color: var(--text-bright); font-size: 12.5px;
  }
  .ms-input::placeholder { color: var(--text-dim); font-size: 12px; }
  .ms-clear {
    background: none; border: none; cursor: pointer;
    color: var(--text-dim); font-size: 12px; line-height: 1;
    padding: 2px 3px; border-radius: 6px;
  }
  .ms-clear:hover { color: var(--text-bright); background: rgba(255,255,255,.06); }

  /* 搜索结果浮层（向上弹出，避免贴底溢出） */
  .ms-results {
    position: absolute;
    bottom: calc(100% + 10px);
    right: 0;
    width: 300px; max-width: 70vw;
    list-style: none; margin: 0; padding: 8px;
    border-radius: 12px;
    background: var(--glass);
    border: 1px solid var(--border);
    box-shadow: 0 10px 40px rgba(0,0,0,.55);
    backdrop-filter: blur(14px);
    overflow-y: auto; max-height: 42vh;
    display: flex; flex-direction: column; gap: 3px;
    animation: msPop .2s ease;
  }
  @keyframes msPop { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
  .ms-result {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px; border-radius: 9px; cursor: pointer;
    transition: background .15s ease;
  }
  .ms-result:hover { background: var(--accent); }
  .ms-cover {
    width: 34px; height: 34px; border-radius: 7px; flex-shrink: 0;
    background: rgba(255,255,255,.06) center / cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 14px;
  }
  .ms-meta { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .ms-name { color: var(--text-bright); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ms-artist { color: var(--text-dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ms-dur { color: var(--text-dim); font-size: 11px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .ms-status { color: var(--text-dim); font-size: 11.5px; padding: 4px 2px 0; text-align: right; }

  /* ================= 播放器（NMP 黑盒视觉替身，前景） ================= */
  .player {
    position: absolute; left: 0; top: 0;
    width: var(--player-w); height: 100%;
    z-index: 3;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
    backdrop-filter: blur(16px);
    display: flex; align-items: center; gap: 12px;
    padding: 0 14px;
  }
  .player-cover {
    width: 48px; height: 48px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, rgba(90,130,255,.5), rgba(140,80,255,.4));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px;
  }
  .player-meta { flex: 1; min-width: 0; }
  .player-meta .t { color: var(--text-bright); font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-meta .s { color: var(--text-dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-ctrls { display: flex; align-items: center; gap: 6px; }
  .player-ctrls button {
    width: 30px; height: 30px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(255,255,255,.06); color: var(--text-bright);
    display: flex; align-items: center; justify-content: center; font-size: 12px;
    transition: background .15s ease;
  }
  .player-ctrls button:hover { background: rgba(255,255,255,.12); }
  .player-ctrls .play { width: 36px; height: 36px; background: rgba(90,130,255,.85); }
  .player-ctrls .play:hover { background: rgba(110,150,255,1); }

  /* ================= 搜索触发图标（落在薄边上的抽屉拉手） ================= */
  .ms-toggle {
    position: absolute;
    top: 10px;
    left: calc(var(--player-w) + var(--peek) - 42px);   /* 收起：贴在露出的薄边上 */
    z-index: 4;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-bright);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
    transition: left var(--t-drawer) var(--ease-drawer),
                transform .25s var(--ease-drawer),
                background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .ms-toggle:hover { background: rgba(20,30,52,.95); }
  .ms-toggle:focus-visible { outline: 2px solid rgba(120,150,220,.9); outline-offset: 2px; }
  /* 收起时脉冲，提示「这里可以拉开」 */
  .music-dock:not(.open) .ms-toggle { animation: hintPulse 2.6s ease-in-out infinite; }
  /* 展开：拉手随薄壳移到最右缘，并旋转 90° */
  .music-dock.open .ms-toggle {
    left: calc(var(--player-w) + var(--open-extra) - 44px);
    transform: rotate(90deg); color: #fff;
    box-shadow: 0 4px 20px rgba(90,130,255,.6);
    animation: none;
  }
  @keyframes hintPulse {
    0%, 100% { box-shadow: 0 4px 16px rgba(0,0,0,.4); }
    50%      { box-shadow: 0 4px 22px rgba(90,130,255,.6); }
  }

  /* 尊重「减少动态效果」偏好 */
  @media (prefers-reduced-motion: reduce) {
    .ms-shell, .ms-toggle, .ms-results, .ms-panel { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <div class="legend">
    音乐搜索 · 抽屉式重设计概念稿 v2<br>
    点击播放器右侧露出的 <b>🔍</b> 薄边标签，向右抽出搜索抽屉（再点 / Esc / 点外部收起）
  </div>

  <div class="music-dock" id="dock">
    <!-- 搜索薄壳（抽屉，位于播放器下层） -->
    <div class="ms-shell" aria-hidden="true">
      <div class="ms-panel">
        <div class="ms-field">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/></svg>
          <input class="ms-input" id="msInput" type="search" placeholder="搜歌曲 / 歌手" autocomplete="off" aria-label="搜索歌曲" />
          <button class="ms-clear" id="msClear" type="button" aria-label="清空" hidden>✕</button>
        </div>
        <ul class="ms-results" id="msResults" hidden></ul>
        <div class="ms-status" id="msStatus"></div>
      </div>
    </div>

    <!-- 播放器视觉替身（前景，代表 NMP 黑盒） -->
    <div class="player" aria-label="音乐播放器（示意）">
      <div class="player-cover">♪</div>
      <div class="player-meta">
        <div class="t">夜的第七章</div>
        <div class="s">周杰伦 / 依然范特西</div>
      </div>
      <div class="player-ctrls">
        <button title="上一首" aria-label="上一首">⏮</button>
        <button class="play" title="播放" aria-label="播放">▶</button>
        <button title="下一首" aria-label="下一首">⏭</button>
      </div>
    </div>

    <!-- 搜索触发图标（抽屉拉手） -->
    <button class="ms-toggle" id="msToggle" type="button" aria-label="搜索歌曲" aria-expanded="false" aria-controls="msInput">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/></svg>
    </button>
  </div>

<script>
  const dock    = document.getElementById('dock');
  const toggle  = document.getElementById('msToggle');
  const input   = document.getElementById('msInput');
  const clear   = document.getElementById('msClear');
  const results = document.getElementById('msResults');
  const status  = document.getElementById('msStatus');

  const FAKE = [
    { id: 1, name: '晴天',        artist: '周杰伦',        dur: '4:29', cover: '' },
    { id: 2, name: '夜的第七章',  artist: '周杰伦 / 黄俊郎', dur: '4:45', cover: '' },
    { id: 3, name: '七里香',      artist: '周杰伦',        dur: '4:59', cover: '' },
    { id: 4, name: '稻香',        artist: '周杰伦',        dur: '3:43', cover: '' },
  ];

  function openDrawer() {
    dock.classList.add('open');
    toggle.setAttribute('aria-expanded', 'true');
    setTimeout(() => input.focus(), 320);
  }
  function closeDrawer() {
    dock.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
    input.value = ''; clear.hidden = true;
    results.hidden = true; results.innerHTML = ''; status.textContent = '';
  }

  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    dock.classList.contains('open') ? closeDrawer() : openDrawer();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && dock.classList.contains('open')) closeDrawer();
  });
  document.addEventListener('click', (e) => {
    if (dock.classList.contains('open') && !dock.contains(e.target)) closeDrawer();
  });

  // 输入模拟（原型无真实 API，用假数据演示浮层）
  let timer;
  input.addEventListener('input', () => {
    clear.hidden = !input.value;
    clearTimeout(timer);
    const q = input.value.trim();
    if (!q) { results.hidden = true; results.innerHTML = ''; status.textContent = ''; return; }
    status.textContent = '搜索中…';
    timer = setTimeout(() => {
      const list = FAKE.filter(s => (s.name + s.artist).includes(q) || q.length);
      if (!list.length) { results.innerHTML = ''; results.hidden = true; status.textContent = '无结果'; return; }
      results.innerHTML = list.map(s => `
        <li class="ms-result" data-id="${s.id}">
          <span class="ms-cover">♪</span>
          <span class="ms-meta">
            <span class="ms-name">${s.name}</span>
            <span class="ms-artist">${s.artist}</span>
          </span>
          <span class="ms-dur">${s.dur}</span>
        </li>`).join('');
      results.hidden = false; status.textContent = '';
    }, 350);
  });

  clear.addEventListener('click', () => {
    input.value = ''; clear.hidden = true;
    results.hidden = true; results.innerHTML = ''; status.textContent = '';
    input.focus();
  });

  results.addEventListener('click', (e) => {
    const li = e.target.closest('.ms-result');
    if (!li) return;
    const name = li.querySelector('.ms-name').textContent;
    status.textContent = '▶ 将播放：' + name;   // 原型示意，真实场景写入 NMP 的 song-id
    setTimeout(closeDrawer, 600);
  });
</script>
</body>
</html>
